<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marshal Lineup System — Login</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Marshal Lineup System</h1>
    <p class="subtitle">Marshals sign in with Google. Employees, use the login below.</p>

    <div id="alertBox"></div>

    <div id="googleSignInSection">
      <div id="googleSignInButton" style="display:flex;justify-content:center;margin:18px 0 6px;"></div>
      <p id="googleUnavailableMsg" style="display:none;color:#8a6d00;background:#fff8e1;border:1px solid #f0dfa0;padding:10px 12px;border-radius:8px;font-size:13.5px;">
        Google sign-in isn't configured on this server yet.
      </p>
    </div>

    <div class="employee-login-toggle" style="margin-top:22px;text-align:center;">
      <button type="button" id="employeeLoginToggle" class="btn-outline btn-small">Employee Login</button>
    </div>

    <form id="loginForm" style="display:none;margin-top:16px;">
      <div class="field">
        <label for="loginUsername">Username or Email</label>
        <input type="text" id="loginUsername" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-block">Log In</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
